[project]
name = "wildfire"
version = "0.1.0"
description = "Interactive 2D wildfire game and stochastic ground-truth simulator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pyyaml>=6",
    "pygame-ce>=2.4",
]

[project.optional-dependencies]
gym = ["gymnasium>=0.29"]
torch = ["torch>=2.2"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5", "matplotlib>=3.8"]

[project.scripts]
wildfire = "wildfire.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wildfire"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "NPY"]
ignore = ["B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
