# Deploys the browser build (web/) to GitHub Pages.
# web/index.html is a page body (it is also published as a claude.ai artifact, which adds the
# document skeleton), so this job wraps it in a full HTML document.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site
        run: |
          mkdir -p _site
          {
            printf '<!doctype html>\n<html lang="en">\n<head>\n<meta charset="utf-8">\n'
            printf '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n'
            printf '<style>body{margin:0}[hidden]{display:none!important}</style>\n</head>\n<body>\n'
            cat web/index.html
            printf '\n</body>\n</html>\n'
          } > _site/index.html
          cp web/wildfire.js _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
